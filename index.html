<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quest Academy</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

    <main class="game">

        <header class="app-header">
        <div class="header-content">
          
            
        </div>
    </header>

    
        <section class="player">

            <div class="avatar">
                
            </div>

            <div class="player-info">
                
               <p><img float="left" width="140" src="0909a1ab97223d53faaab058c43ec079-removebg-preview.png" alt="Personagem feminina em pixel art, de cabelo curto e escuro, em pé e de frente, usando vestido preto; ela tem uma expressão tranquila e detalhes brancos no cabelo. A personagem aparece centralizada sobre um fundo preto, sem texto visível."></p>
                <h2>Aventura Musical</h2>

                <p>Nível <span id="nivel">1</span></p>

                <div class="xp-container">
                    <div id="xp-barra"></div>
                </div>

                <p>
                    <p>
                        <span id="xp">0</span> / <span id="xp-max">1000</span> XP
                    </p>
                </p>

            </div>

        </section>


        <section class="missions">

            <h2>🎼 MISSÕES</h2>

            <div id="lista-missoes">

                <div class="mission"></div>

            </div>

        </section>


        <section class="achievements">

            <h2>🏆 Conquistas</h2>

            <div class="achievement">
                ⭐ Primeira missão
            </div>

            <div class="achievement locked">
                🔒 Mestre Musical
            </div>

        </section>

<footer class="app-footer">
    <div class="footer-content">
      <nav class="footer-nav">
        <!-- Ícone 1: Início -->
        <a href="#" class="nav-item active" title="Início" aria-label="Início">
            <i class="fa-solid fa-house"></i>
        </a>

        <!-- Ícone 2: Missões -->
        <a href="#" class="nav-item" title="Missões" aria-label="Missões">
            <i class="fa-solid fa-list-check"></i>
        </a>

        <!-- Ícone 3: Conquistas -->
        <a href="#" class="nav-item" title="Conquistas" aria-label="Conquistas">
            <i class="fa-solid fa-trophy"></i>
        </a>
    </nav>     
      
            
        </div>
    
</footer>
