<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quest Academy</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="game">

        <header>
            <h1>⚔️ Quest Academy</h1>
            <p>Minha jornada musical</p>
        </header>

        <section class="player">

            <div class="avatar">
                🎸
            </div>

            <div class="player-info">

                <h2>Músico</h2>

                <p>Nível <span id="nivel">1</span></p>

                <div class="xp-container">
                    <div id="xp-barra"></div>
                </div>

                <p>
                    <p>
                        <span id="xp">0</span> / <span id="xp-max">1000</span> XP
                    </p>
                </p>

            </div>

        </section>


        <section class="missions">

            <h2>🎼 Missões</h2>

            <div id="lista-missoes">

                <div class="mission"></div>

            </div>

        </section>


        <section class="achievements">

            <h2>🏆 Conquistas</h2>

            <div class="achievement">
                ⭐ Primeiro Código
            </div>

            <div class="achievement locked">
                🔒 Mestre JavaScript
            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
